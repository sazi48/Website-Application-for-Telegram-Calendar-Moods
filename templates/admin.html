<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Админ-панель</title>
  <style>
    body { background: #111; color: #eee; font-family: Arial, sans-serif; padding: 20px; }
    h1, h2 { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; margin-bottom: 40px; }
    th, td { border: 1px solid #444; padding: 8px; }
    th { background: #222; }
    tr:nth-child(even) { background: #222; }
  </style>
</head>
<body>
  <h1>Админ-панель</h1>
  {% if data %}
    {% for user, records in data.items() %}
      <h2>Пользователь: {{ user }}</h2>
      <table>
        <thead>
          <tr><th>Дата</th><th>Настроение</th><th>Комментарий</th></tr>
        </thead>
        <tbody>
          {% for rec in records %}
            <tr>
              <td>{{ rec.date }}</td>
              <td>{{ rec.mood }}</td>
              <td>{{ rec.comment }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endfor %}
  {% else %}
    <p>Нет данных для отображения.</p>
  {% endif %}
</body>
</html>
